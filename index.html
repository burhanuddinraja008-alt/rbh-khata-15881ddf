*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#faf9f7;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px;padding-top:max(20px,env(safe-area-inset-top))}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:.5px}
.ver{margin:24px 0 8px;text-align:center;color:#999;font-size:12px}
.ver a{color:#666;padding:10px 6px}
.lock{padding:40px 8px;text-align:center}
.lock input{width:100%;height:50px;margin:14px 0;padding:0 14px;border:2px solid #cfcfcf;border-radius:12px;font-size:20px;text-align:center;font-family:inherit}
.lock .btn{width:100%;line-height:50px;min-height:50px}
.lock .err{color:#b3261e;font-weight:700;min-height:22px;margin:0}
.upd{margin:0 0 16px;color:#666;font-size:15px}
.total{background:#111;color:#fff;border-radius:16px;padding:18px 20px;margin:0 0 16px;border:1px solid #b8923a}
.total small{display:block;font-size:15px;opacity:.8}
.total b{font-size:34px;font-weight:800;color:#e6c26a}
.parties{display:flex;flex-direction:column;gap:12px}
.card{border:2px solid #cfcfcf;border-radius:18px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);overflow:hidden}
.party{background:#fff}
.card>.wrow{margin:0;padding:0 16px 16px}
.num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-right:8px;border-radius:50%;background:#111;color:#fff;font-size:14px;font-weight:700;vertical-align:middle}

.p-name{font-size:18px;font-weight:700;line-height:1.25;word-break:break-word}
.p-bal small,.p-sum small{display:block;font-size:14px;color:#666}
.p-bal b{font-size:26px;font-weight:800}
.due{color:#b3261e}.clear{color:#1b7a3d;font-weight:800}
.pill{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;background:#dff3e5;color:#1b7a3d;border:1px solid #1b7a3d;font-size:13px;font-weight:800;letter-spacing:.5px;vertical-align:middle}
.party summary::after{content:"Tap for full history \25BE";font-size:14px;color:#666}body.hi .party summary::after{content:"\092A\0942\0930\093E \0939\093F\0938\093E\092C \25BE"}
.party[open] summary::after{content:"Close \25B4"}body.hi .party[open] summary::after{content:"\092C\0902\0926 \0915\0930\0947\0902 \25B4"}
.p-body{padding:0 16px 16px;border-top:1px solid #eee}
.p-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0}
.p-sum b{font-size:18px;font-weight:700}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{background:#f6f4ef;border-radius:12px;padding:12px 14px}
.h-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#555}
.h-type{font-weight:700;color:#111}
.h-amt{font-size:22px;font-weight:800;margin-top:4px}
.h-bal{font-size:15px;margin-top:2px}
.h-note{font-size:14px;color:#666;margin-top:4px}
.btn{display:inline-block;margin-top:8px;min-height:44px;line-height:44px;padding:0 18px;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:700;border:0;font-size:16px;font-family:inherit}
.wa{background:#1b7a3d}
.wa.on{outline:3px solid #111}
.amt{display:flex;gap:8px;width:100%;margin-top:4px}
.amt[hidden]{display:none}
.amt input{flex:1;min-width:0;height:44px;padding:0 12px;border:2px solid #cfcfcf;border-radius:10px;font-size:18px;font-family:inherit}
.amt .btn{margin-top:0}
.amt{flex-wrap:wrap}
.amsg{flex-basis:100%;margin:0;color:#b3261e;font-size:14px;font-weight:700}
.amsg[hidden]{display:none}
.pend{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:14px 16px;background:#1b7a3d;color:#fff;text-decoration:none;font-weight:700;font-size:16px;line-height:1.3}
.pend b{background:#fff;color:#1b7a3d;border-radius:8px;padding:8px 16px;font-size:13px}.main-tabs{display:flex;gap:8px;margin:8px 0 14px}.main-tabs .btn{flex:1;margin:0}.main-tabs .active{background:#1b7a3d}.backup-feature .backup-actions{display:flex;gap:8px;flex-wrap:wrap}.backup-feature .btn{font-size:14px;padding:0 12px}#homeView[hidden],#reviewView[hidden]{display:none}
.wrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.wrow .btn{margin:0}
.bill-img{display:block;width:100%;height:auto;margin-top:10px;border-radius:8px}

 var h=rows.map(function(x){var e=x.e;return '<li><div class="h-top"><span>'+esc(e.date)+'</span><span class="h-type">'+L[e.type]+'</span></div><div class="h-amt">'+(sg(e)<0?'\u2212 ':'')+inr(e.amount)+'</div><div class="h-bal">'+(TR.balanceLabel||'Balance: ')+'<b'+(x.r===0?' class="clear"':'')+'>'+inr(x.r)+'</b>'+(x.r===0?' <span class="pill">\u2713 '+(TR.clearTick||'CLEAR')+'</span>':'')+'</div>'+(e.note?'<div class="h-note">'+esc(e.note)+'</div>':'')+(e.bill?'<button class="btn bill" data-src="bills/'+esc(e.bill)+'">'+(TR.viewBill||'View Bill')+'</button>':'')+'</li>'}).join('');
 var w='';if(p.phone){w='<div class="wrow"><button class="btn wa" data-k="purchase" data-i="'+i+'">'+(TR.waPurchase||'WhatsApp: Purchase')+'</button><button class="btn wa" data-k="payment" data-i="'+i+'">'+(TR.waPayment||'WhatsApp: Payment Done')+'</button>';if(b>0)w+='<a class="btn wa" target="_blank" rel="noopener" href="'+esc(wa(p,'Dear '+p.short+', your pending payment of '+inr(b)+' will be cleared within this week. Thank you for your patience.'+SIG))+'">'+(TR.waNeedTime||'WhatsApp: Need Time')+'</a>';w+='<a class="btn wa" target="_blank" rel="noopener" href="'+esc(wa(p,'Dear '+p.short+', your payment has been received in full. Your account is now clear (balance \u20B90). Thank you.'+SIG))+'">'+(TR.waClear||'WhatsApp: Hisaab Clear')+'</a><form class="amt" hidden data-i="'+i+'"><input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="'+(TR.amtPh||'Amount \u20B9')+'" aria-label="'+(TR.amtAria||'Amount')+'"><button class="btn" type="submit">'+(TR.go||'Go')+'</button><p class="amsg" hidden></p></form></div>'}
 var next=nextDates(),saved=next[p.name]||'',rem=b>0?'<section class="next-box"><p class="next-title">'+(TR.nextTitle||'Next payment date')+'</p>'+(saved?'<p class="next-saved">'+(TR.nextSaved||'Next payment: ')+esc(prettyDate(saved))+'</p>':'')+'<input type="date" aria-label="'+(TR.nextAria||'Next payment date for ')+esc(dname(p.name))+'" value="'+esc(saved)+'" data-next-input="'+i+'"><div class="next-actions"><button class="btn" type="button" data-next-save="'+i+'">'+(TR.saveDate||'Save date')+'</button>'+(saved?'<button class="btn" type="button" data-next-clear="'+i+'">'+(TR.clearDate||'Clear date')+'</button>':'')+'</div><p class="next-help">'+(TR.nextHelp||'Saved on this phone for your reference only. No supplier message is sent.')+'</p></section>':'';
 return '<div class="card">'+(p.phone?pend(p,i):'')+'<details class="party"><summary><span class="p-name"><span class="num">'+(i+1)+'</span>'+esc(dname(p.name))+'</span><span class="p-bal"><small>'+(TR.toPay||'To Pay')+'</small><b class="'+(b>0?'due':'clear')+'">'+inr(b)+'</b>'+(b===0?'<span class="pill">\u2713 '+(TR.clearTick||'CLEAR')+'</span>':'')+'</span></summary><div class="p-body"><div class="p-sum"><div><small>'+(TR.goodsReceived||'Goods Received')+'</small><b>'+inr(sum(p.entries,['opening','maal']))+'</b></div><div><small>'+(TR.paymentMade||'Payment Made')+'</small><b>'+inr(sum(p.entries,['payment']))+'</b></div><div><small>'+(TR.adjusted||'Adjusted')+'</small><b>'+inr(sum(p.entries,['kata']))+'</b></div><div><small>'+(TR.balanceSm||'Balance')+'</small><b>'+inr(b)+'</b></div></div><ol class="hist">'+h+'</ol></div></details>'+rem+w+'</div>'
}
function render(){
 var T=0;PARTIES.forEach(function(p){T+=bal(p.entries)});
 document.getElementById('app').innerHTML='<h1>'+(TR.appTitle||'RBH KHATA BOOK')+'</h1><p class="upd">'+(TR.updated||'Updated: ')+UPDATED+'</p><nav class="main-tabs" aria-label="Main sections"><button type="button" class="btn active" data-tab="home">'+(TR.tabHome||'Home')+'</button><button type="button" class="btn" data-tab="review">'+(TR.tabReview||'Monthly Review')+'</button></nav><section id="homeView"><section class="total"><small>'+(TR.totalPayable||'Total Payable')+'</small><b>'+inr(T)+'</b></section><div class="parties">'+PARTIES.map(party).join('')+'</div><section class="feature backup-feature"><h2>'+(TR.backupH||'Backup and export')+'</h2><p class="feature-note">'+(TR.backupNote1||'Encrypted backup uses the existing PIN. CSV export contains readable supplier and transaction details. Keep it private; anyone with the file can read it.')+'</p><div class="backup-actions"><button type="button" class="btn" data-export="backup">'+(TR.dlBackup||'Download encrypted backup')+'</button><button type="button" class="btn" data-export="csv">'+(TR.exportCsv||'Export CSV')+'</button></div><p class="next-help">'+(TR.backupNote2||'Backup is encrypted with the existing PIN and includes the salt needed for future recovery. Restore is not built yet; keep the encrypted copy and current app link safe. CSV is readable financial data, so store it privately.')+'</p></section></section><section id="reviewView" hidden><section class="feature"><h2>'+(TR.reviewH||'Monthly Review')+'</h2><p class="feature-note">'+(TR.reviewNote||'This month or last month: goods received, payments, adjustments and balances.')+'</p><div class="month-buttons"><button type="button" class="btn active" data-month="0">'+(TR.thisMonth||'This month')+'</button><button type="button" class="btn" data-month="-1">'+(TR.lastMonth||'Last month')+'</button></div><p id="monthLabel" class="month-heading"></p><label for="monthParty">'+(TR.supplierLbl||'Supplier')+'</label><select id="monthParty"><option value="all">'+(TR.allSuppliers||'All suppliers')+'</option>'+PARTIES.map(function(p){return '<option value="'+esc(p.name)+'">'+esc(dname(p.name))+'</option>'}).join('')+'</select><div id="monthRows" class="month-grid"></div><p class="next-help">'+(TR.reviewFoot||'Payments are shown as recorded; no cash or payment method is assumed.')+'</p></section><section class="feature"><h2>'+(TR.findH||'Find a ledger entry')+'</h2><p class="feature-note">'+(TR.findNote||'Search by amount, date, note or supplier; filter by purchase or payment. Search uses saved text only, no OCR.')+'</p><div class="filter-row"><input id="historySearch" type="search" placeholder="'+(TR.searchPh||'Amount, date, note or supplier')+'" autocomplete="off"><select id="historyKind" aria-label="'+(TR.filterAria||'Filter history type')+'"><option value="all">'+(TR.allEntries||'All entries')+'</option><option value="purchase">'+(TR.purchases||'Purchases')+'</option><option value="payment">'+(TR.paymentsF||'Payments')+'</option><option value="adjusted">'+(TR.adjustmentsF||'Adjustments')+'</option></select></div><p id="historyCount" class="history-count"></p><ol id="searchResults" class="search-results"></ol></section></section><p class="ver">v15 · <a href="#" id="lk">'+(TR.lock||'Lock')+'</a> · <a href="#" id="lg">'+(LANG==='hi'?'English':'हिंदी')+'</a></p>';refreshMonth();globalSearch();
}
function setTab(name){var home=document.getElementById('homeView'),review=document.getElementById('reviewView');if(!home||!review)return;home.hidden=name!=='home';review.hidden=name!=='review';document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===name)});if(name==='review'){refreshMonth();globalSearch()}}
function csvCell(v){var s=String(v==null?'':v);if(typeof v==='string'&&/^[\t\r\n ]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function downloadFile(name,type,text){var a=document.createElement('a'),blob=new Blob([text],{type:type}),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function exportCsv(){var rows=[['Supplier','Phone','Type','Date','Amount INR','Running balance INR','Note','Bill reference']];PARTIES.forEach(function(p){var run=0;p.entries.forEach(function(e){run+=sg(e);rows.push([p.name,p.phone||'',L[e.type]||e.type,e.date,e.amount,run,e.note||'',e.bill||''])})});downloadFile('rbh-khata-ledger-'+new Date().toISOString().slice(0,10)+'.csv','text/csv;charset=utf-8','\uFEFF'+rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n'))}
function exportBackup(){var raw;try{raw=localStorage.getItem('rbh_k')}catch(x){}if(!raw){alert(TR.bkLock||'Unlock again before making a backup.');return}var key=crypto.subtle.importKey('raw',b2u(raw),'AES-GCM',false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),data=new TextEncoder().encode(JSON.stringify({u:UPDATED,p:PARTIES}));key.then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,data)}).then(function(buf){downloadFile('rbh-khata-encrypted-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify({format:'RBH-KHATA-ENCRYPTED-BACKUP',version:1,createdAt:new Date().toISOString(),salt:BLOB.s,iterations:IT,iv:u2b(iv),ciphertext:u2b(new Uint8Array(buf))},null,2))}).catch(function(){alert(TR.bkFail||'Backup failed. No file was downloaded.')})}
document.addEventListener('input',function(ev){if(ev.target&&ev.target.id==='historySearch')globalSearch()});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='historyKind')globalSearch();if(ev.target&&ev.target.id==='monthParty')refreshMonth()});
document.addEventListener('click',function(ev){var tab=ev.target.closest&&ev.target.closest('button[data-tab]');if(tab){setTab(tab.getAttribute('data-tab'));return}var ex=ev.target.closest&&ev.target.closest('button[data-export]');if(ex){if(ex.getAttribute('data-export')==='csv')exportCsv();else exportBackup();return}var m=ev.target.closest&&ev.target.closest('button[data-month]');if(m){monthOffset=+m.getAttribute('data-month');document.querySelectorAll('button[data-month]').forEach(function(x){x.classList.toggle('active',x===m)});refreshMonth();return}var save=ev.target.closest&&ev.target.closest('button[data-next-save]'),clear=ev.target.closest&&ev.target.closest('button[data-next-clear]');if(save||clear){var i=+(save||clear).getAttribute(save?'data-next-save':'data-next-clear'),p=PARTIES[i],map=nextDates();if(clear)delete map[p.name];else{var inp=document.querySelector('input[data-next-input="'+i+'"]');if(!inp||!inp.value)return;map[p.name]=inp.value}try{localStorage.setItem(nextKey,JSON.stringify(map))}catch(x){}render();return}});
document.addEventListener('click',function(ev){
 var b=ev.target.closest&&ev.target.closest('.bill');if(!b)return;
 var n=b.nextElementSibling;
 if(n&&n.tagName==='IMG'){n.remove();b.textContent=TR.viewBill||'View Bill';return}
 var i=document.createElement('img');i.className='bill-img';i.alt='Bill';i.src=b.getAttribute('data-src');b.after(i);b.textContent=TR.hideBill||'Hide Bill'});
document.addEventListener('click',function(ev){
 var t=ev.target.closest&&ev.target.closest('button[data-k]');if(!t)return;
 var row=t.parentNode,f=row.querySelector('.amt');
 if(!f.hidden&&f.getAttribute('data-k')===t.getAttribute('data-k')){f.hidden=true;return}
 f.hidden=false;f.setAttribute('data-k',t.getAttribute('data-k'));
 Array.prototype.forEach.call(row.querySelectorAll('button[data-k]'),function(x){x.classList.toggle('on',x===t)});
 var inp=f.querySelector('input');inp.value='';inp.focus();
});
document.addEventListener('click',function(ev){
 var a=ev.target.closest&&ev.target.closest('a.pend');if(!a)return;
 var k=a.getAttribute('data-sk');if(!k)return;
 var m=sentMarks();if(m.indexOf(k)<0){m.push(k);try{localStorage.setItem(sentMarkKey,JSON.stringify(m))}catch(x){}}
 a.style.display='none'});
document.addEventListener('submit',function(ev){
 var f=ev.target;if(!f.classList.contains('amt'))return;ev.preventDefault();
 var p=PARTIES[+f.getAttribute('data-i')],k=f.getAttribute('data-k'),inp=f.querySelector('input');
 var n=parseInt(inp.value.replace(/[^0-9]/g,''),10);
 var b=bal(p.entries),txt,mg=f.querySelector('.amsg');mg.hidden=true;
 function bad(m){mg.textContent=m;mg.hidden=false;inp.focus()}
 if(!n||n<1)return bad(TR.amtErr||'Enter an amount greater than \u20B90');
 if(k==='payment'&&n>b)return bad('Payment balance ('+inr(b)+') se zyada nahi ho sakti');
 if(k==='payment')txt='Dear '+p.short+', '+inr(n)+' has been paid towards your account today. Remaining balance: '+inr(b-n)+'. Thank you.'+SIG;
 else txt='Dear '+p.short+', we have received a new purchase of '+inr(n)+' from you. Total outstanding: '+inr(b+n)+'.'+SIG;
 window.open(wa(p,txt),'_blank');
});

var IT=300000;
function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function u2b(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function dec(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(BLOB.i)},k,b2u(BLOB.c))}).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}
function wireLang(){var lg=document.getElementById('lg');if(lg)lg.addEventListener('click',function(e){e.preventDefault();try{localStorage.setItem('rbh_lang',LANG==='hi'?'en':'hi')}catch(x){}location.reload()})}
function open_(D){UPDATED=D.u;PARTIES=D.p;document.body.className=LANG==='hi'?'hi':'';render();wireLang();var lk=document.getElementById('lk');if(lk)lk.addEventListener('click',function(e){e.preventDefault();try{localStorage.removeItem('rbh_k')}catch(x){}location.reload()})}
function lockScreen(){
 document.getElementById('app').innerHTML='<h1>'+(TR.appTitle||'RBH KHATA BOOK')+'</h1><form class="lock" id="lf"><p>'+(TR.enterPin||'Enter PIN to open')+'</p><input id="pin" type="password" autocomplete="off" aria-label="PIN"><p class="err" id="err"></p><button class="btn" type="submit">'+(TR.unlock||'Unlock')+'</button><p class="ver">v15 · <a href="#" id="lg">'+(LANG==='hi'?'English':'हिंदी')+'</a></p></form>';document.body.className=LANG==='hi'?'hi':'';wireLang();
 var f=document.getElementById('lf'),pin=document.getElementById('pin'),err=document.getElementById('err');pin.focus();
 f.addEventListener('submit',function(e){e.preventDefault();var v=pin.value;if(!v)return;err.textContent=TR.unlocking||'Unlocking...';
  crypto.subtle.importKey('raw',new TextEncoder().encode(v),'PBKDF2',false,['deriveBits']).then(function(km){return crypto.subtle.deriveBits({name:'PBKDF2',salt:b2u(BLOB.s),iterations:IT,hash:'SHA-256'},km,256)}).then(function(bits){var raw=new Uint8Array(bits);return dec(raw).then(function(D){try{localStorage.setItem('rbh_k',u2b(raw))}catch(x){}open_(D)},function(){err.textContent=TR.wrongPin||'Wrong PIN';pin.value='';pin.focus()})}).catch(function(){err.textContent=TR.couldNot||'Could not unlock'})})}
(function(){var k=null;try{k=localStorage.getItem('rbh_k')}catch(x){}
 if(!k||!window.crypto||!crypto.subtle){lockScreen();return}
 dec(b2u(k)).then(open_,lockScreen)})();
if('serviceWorker' in navigator){
 var had=!!navigator.serviceWorker.controller,rl=false;
 navigator.serviceWorker.addEventListener('controllerchange',function(){if(had&&!rl){rl=true;location.reload()}had=true});
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
  reg.update().catch(function(){});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)reg.update().catch(function(){})});
 }).catch(function(){});
}
</script></body></html>
