*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#faf9f7;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px;padding-top:max(20px,env(safe-area-inset-top))}
h1{font-size:28px;margin:8px 0 4px;letter-spacing:.5px}
.ver{margin:24px 0 8px;text-align:center;color:#999;font-size:12px}
.ver a{color:#666;padding:10px 6px}
.lock{padding:40px 8px;text-align:center}
.lock input{width:100%;height:50px;margin:14px 0;padding:0 14px;border:2px solid #cfcfcf;border-radius:12px;font-size:20px;text-align:center;font-family:inherit}
.lock .btn{width:100%;line-height:50px;min-height:50px}
.lock .err{color:#b3261e;font-weight:700;min-height:22px;margin:0}
.upd{margin:0 0 16px;color:#666;font-size:15px}
.total{background:#111;color:#fff;border-radius:16px;padding:18px 20px;margin:0 0 16px;border:1px solid #b8923a}
.total small{display:block;font-size:15px;opacity:.8}
.total b{font-size:34px;font-weight:800;color:#e6c26a}
.parties{display:flex;flex-direction:column;gap:12px}
.card{border:2px solid #cfcfcf;border-radius:18px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);overflow:hidden}
.party{background:#fff}
.card>.wrow{margin:0;padding:0 16px 16px}
.num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-right:8px;border-radius:50%;background:#111;color:#fff;font-size:14px;font-weight:700;vertical-align:middle}
.party summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px;min-height:44px}
.party summary::-webkit-details-marker{display:none}
.p-name{font-size:18px;font-weight:700;line-height:1.25;word-break:break-word}
.p-bal small,.p-sum small{display:block;font-size:14px;color:#666}
.p-bal b{font-size:26px;font-weight:800}
.due{color:#b3261e}.clear{color:#1b7a3d;font-weight:800}
.pill{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;background:#dff3e5;color:#1b7a3d;border:1px solid #1b7a3d;font-size:13px;font-weight:800;letter-spacing:.5px;vertical-align:middle}
.party summary::after{content:"Tap for full history \25BE";font-size:14px;color:#666}
.party[open] summary::after{content:"Close \25B4"}
.p-body{padding:0 16px 16px;border-top:1px solid #eee}
.p-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0}
.p-sum b{font-size:18px;font-weight:700}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{background:#f6f4ef;border-radius:12px;padding:12px 14px}
.h-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#555}
.h-type{font-weight:700;color:#111}
.h-amt{font-size:22px;font-weight:800;margin-top:4px}
.h-bal{font-size:15px;margin-top:2px}
.h-note{font-size:14px;color:#666;margin-top:4px}
.btn{display:inline-block;margin-top:8px;min-height:44px;line-height:44px;padding:0 18px;border-radius:10px;background:#111;color:#fff;text-decoration:none;font-weight:700;border:0;font-size:16px;font-family:inherit}
.wa{background:#1b7a3d}
.wa.on{outline:3px solid #111}
.amt{display:flex;gap:8px;width:100%;margin-top:4px}
.amt[hidden]{display:none}
.amt input{flex:1;min-width:0;height:44px;padding:0 12px;border:2px solid #cfcfcf;border-radius:10px;font-size:18px;font-family:inherit}
.amt .btn{margin-top:0}
.amt{flex-wrap:wrap}
.amsg{flex-basis:100%;margin:0;color:#b3261e;font-size:14px;font-weight:700}
.amsg[hidden]{display:none}
.pend{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:14px 16px;background:#1b7a3d;color:#fff;text-decoration:none;font-weight:700;font-size:16px;line-height:1.3}
.pend b{background:#fff;color:#1b7a3d;border-radius:8px;padding:8px 16px;font-size:16px}
.wrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.wrow .btn{margin:0}
.bill-img{display:block;width:100%;height:auto;margin-top:10px;border-radius:8px}

var IT=300000;
function b2u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function u2b(a){var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function dec(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(BLOB.i)},k,b2u(BLOB.c))}).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))})}
